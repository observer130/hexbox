# Windows 桌面打包配置（electron-builder 26.x）
#
# 用法（在仓库根或 apps/overlay 下都行）：
#   pnpm --filter @hexbox/overlay package:win     # NSIS 安装包 + 便携版
#   pnpm --filter @hexbox/overlay package:dir     # 只出免安装目录（快速验证配置）
#
# 设计要点（**别随手改**，每一条都对应一个真实约束）：
#
# 1. `directories.app` 就是本包（apps/overlay）。**不新增 apps/desktop**：
#    本包已经是 workspace 项目、已声明 main=dist/main/index.cjs，
#    再开一个"打包壳"只会让 `pnpm -r` 多一个项目、多一份要同步的元数据。
#
# 2. `files` 只放 **esbuild 产物**。主进程/preload/渲染端所需的一切
#    （含 @hexbox/* 四个 workspace 包）都已经被 esbuild 内联进 dist/*.cjs，
#    所以打包**不需要** node_modules —— 也因此不可能把仓库源码、
#    `data/`、`debug/`（真机截图，含个人信息）带进安装包。
#
# 3. **不随包发数据集**（2026-11 用户决策：数据与安装位置解耦，见第 6 条）。
#    唯一的例外是海克斯名字指纹库 `data/augment-names.json`：它由构建期脚本从
#    系统字体生成、运行时无法重建，缺了它局内一张强度标签都画不出来
#    （`extraResources` 里那条带 filter 的就是它，别删）。
#    ⚠️ 打包前置：那份文件不在仓库里（`data/` 已 gitignore）——
#    先跑 `pnpm sync`（或 `scripts/render-augment-name-fingerprints.ps1`），
#    否则这条 extraResources 找不到源文件。
#    主进程启动时会把它拷进用户数据目录（`main/index.ts` 的 ensureAugmentLibrary），
#    所以**运行时不需要额外配置**。
#    数据集本体（dataset/rankings/builds/templates）**一律不在包里**：它们在用户
#    文档目录 `文档\hexbox\data`（见 `main/user-paths.ts` 与
#    `vision/data-location.ts`），首次运行由托盘「更新数据」下载。
#    日常更新走托盘（`main/data-update-flow.ts`），不需要重新打包；
#    旧版本内置的 `resources\data` 仍被当作**只读回退**识别，升级用户无感。
#
# 4. `requestedExecutionLevel` 见 docs/RELEASE-WINDOWS.md §权限：
#    国服（WeGame）客户端的 `LeagueClient\lockfile` 实测为 **0 字节**，
#    非管理员又读不到进程命令行 → **拿不到 token → 阶段恒为 None →
#    选人标签与局内海克斯标签全都不会出现**。所以默认要求管理员。
#    想改成"默认不提权"：把这一行换成 asInvoker（代价见文档）。
#
# 5. 托盘图标（`build/tray/*`）走 `extraResources` → `resources/tray/`：
#    esbuild 不搬静态资源，`files` 里只会有 dist 产物，所以图标只能这么进包
#    （见下面 extraResources 里的注释；缺了它有兜底但会糊）。

appId: dev.hexbox.overlay
productName: hexbox
copyright: hexbox

directories:
  # 只出 dist 与 package.json（原因见上面第 2 条）
  output: ../../release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - '!**/*.map'
  # ⚠️ 必须显式排除 node_modules：electron-builder 会**自动**把
  #    package.json 里 dependencies 的**生产依赖**塞进包（本仓库是
  #    workspace:* 链接）→ 实测会把 packages/*/src/**.test.ts、tsconfig.json
  #    一起打进去（首次打包列表核对：130 个文件、asar 1.74MB）。
  #    而本包**不需要**任何 node_modules：主进程/preload/渲染端所需的一切
  #    都已经被 esbuild 内联进 dist/*.cjs（这也是"不可能把源码带进安装包"的原因）。
  - '!node_modules/**/*'
  # ⚠️ 诊断/录制入口**不进安装包**（决策见 docs/RELEASE-WINDOWS.md §发布哪些入口）：
  #    · `--label-overlay-test` 已经把"覆盖窗自测"做进了主入口，
  #      玩家日常排查显示问题不再需要一个 debug 版；
  #    · `debug-augment.cjs`（真机录制）依赖 launcher 的 Ctrl+C 哨兵
  #      （run-electron.mjs，不发进安装包），且产物目录在打包后是 cwd 下的
  #      `debug/augment`（要发布它得先改到 %LOCALAPPDATA%）；
  #    · `debug-capture.cjs` / `phase-probe.cjs` 是开发期工具。
  #    想出一个带的版本：删掉下面三行、把 output 换成别的目录即可。
  - '!dist/debug-*.cjs'
  - '!dist/phase-probe.cjs'

# 数据**不再随安装包发布**（2026-11 起，用户决策：数据与安装位置解耦）：
#   数据放在用户文档目录 `文档\hexbox\data`（见 main/user-paths.ts 与
#   vision/data-location.ts），首次运行由托盘「更新数据」下载。
#   因此安装包少了 ~6MB；升级/卸载也不会连带删掉数据。
#   旧版本内置的 `resources\data` 仍被当作**只读回退**识别，升级用户无感。
extraResources:
  # 唯一还随包的数据文件：海克斯名字指纹库（0.24 MB）。
  # 它由 `scripts/render-augment-name-fingerprints.ps1` 在**构建期**从系统字体生成，
  # 运行时无法重建（不是从上游拉的数据），缺了它 = 局内认不出海克斯名 → 一张强度标签都不画。
  # 主进程会在启动时把它拷进用户数据目录（`main/index.ts` 的 ensureAugmentLibrary）。
  - from: ../../data
    to: data
    filter:
      - augment-names.json
  # 托盘图标（`scripts/make-tray-icon.py` 生成；随仓库提交）。
  # ⚠️ 必须走 extraResources：`files` 只放 esbuild 产物，而 esbuild **不搬静态资源**
  #    （build.mjs 只 cp 渲染端的 html/css），所以图标不可能出现在 dist/ 里。
  #    落点是 `resources/tray/`，主进程 `main/tray.ts` 的 trayIconDirs() 按
  #    `process.resourcesPath/tray` 找它（开发版走 apps/overlay/build/tray）。
  #    缺了它不会崩（有兜底：源图缩到 16px），但托盘图标会变糊 —— 别删这一条。
  - from: build/tray
    to: tray
    filter:
      - '*.png'
      - '*.ico'

asar: true
# 依赖已经被 esbuild 内联；不重编、不从源码构建依赖（本机也没装 VS 工具链）
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # 见上面第 4 条
  requestedExecutionLevel: requireAdministrator
  # ⚠️ 本机**没有代码签名证书** → 不设 publisherName（v26 里它挪到了
  #    win.signtoolOptions.publisherName，且只在签名时才有意义）。
  #    后果见 docs/RELEASE-WINDOWS.md §代码签名：安装器与 exe 都显示
  #    "未知发布者"，首次运行会有 SmartScreen 警告。
  icon: build/icon.png

nsis:
  # 非一键安装：允许用户选安装目录（一键装会把 UAC 与目录选择都吞掉）
  oneClick: false
  # 每用户安装：安装本身**不需要**管理员（程序运行时才提权）
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: hexbox
  # 中文安装界面（2052 = 简体中文）
  language: '2052'
  artifactName: hexbox-setup-${version}-${arch}.${ext}
  # 卸载时保留 %LOCALAPPDATA%\hexbox（日志等运行时产物），想彻底清干净就手动删。
  # ⚠️ **数据不在这个目录里**：数据集与录制产物在 `文档\hexbox\data`、
  #    `文档\hexbox\…`（见 main/user-paths.ts），卸载本来就不会碰它们。
  deleteAppDataOnUninstall: false

portable:
  artifactName: hexbox-portable-${version}-${arch}.${ext}
  # ⚠️ 便携版必须自己先提权再启动内层 exe：内层程序的清单写了
  #    requireAdministrator，而未提权的进程 CreateProcess 一个要求提权的
  #    exe 会直接失败（ERROR_ELEVATION_REQUIRED / 740）。
  requestExecutionLevel: admin
